<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - RTS</title>
    <link href="cadastro.css" rel="stylesheet">
</head>

<body>

    <header>
        <h1 class="logo">
            <a href="index.html">LOGOTIPO</a>
        </h1>
    </header>

    <main>
        <section class="cadastro" aria-label="Cadastro da empresa">
            <form action="index.html">

                <label for="empresa">Nome da empresa</label>
                <input id="empresa" name="empresa" type="text" required>

                <label for="cnpj">CNPJ</label>
                <input id="cnpj" name="cnpj" type="text" required>

                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" required>

                <label for="telefone">Telefone</label>
                <input id="telefone" name="telefone" type="tel">

                <label for="senha">Senha</label>
                <input id="senha" name="senha" type="password" required>

                <label for="confirmar">Confirmar senha</label>
                <input id="confirmar" name="confirmar" type="password" required>

                <button type="submit">Cadastrar</button>

            </form>
        </section>
    </main>

</body>
</html>
