<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTS - Route Tech System</title>
    <link rel="stylesheet" href="painel.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>RTS - Route Tech System</h1>

        <nav aria-label="Navegação da conta">
            <a href="index.html">Sair</a>
        </nav>
    </header>

    <div class="container">

        <nav class="menu" aria-label="Navegação principal">
            <ul>
                <li><a href="painelMotorista.html">Dashboard</a></li>
                <li><a href="perfilMotorista.html">Perfil</a></li>
                <li><a href="agendamentoMotorista.html">Agendamento</a></li>
                <li><a href="frotasMotorista.html">Frotas</a></li>
                <li class="atual">
                    <a href="checklistMotorista.html" aria-current="page">Check-List</a>
                </li>
                <li><a href="notificacoesMotorista.html">Notificações</a></li>
            </ul>
        </nav>

        <main class="conteudo">
            <section aria-labelledby="titulo-checklist">
                <h2 id="titulo-checklist">Check-List</h2>
                <h4>Registre o estado do veículo na retirada ou na devolução</h4>

                <div class="filtros">
                    <button type="button" id="btn-retirada">Retirada</button>
                    <button type="button" id="btn-devolucao">Devolução</button>
                </div>

                <form id="form-retirada" hidden>
                    <label for="km-retirada">Quilometragem atual:</label>
                    <input type="number" id="km-retirada" required>

                    <label for="foto-odometro-retirada">Foto do odômetro:</label>
                    <input type="file" id="foto-odometro-retirada" accept="image/*" required>

                    <label for="combustivel-retirada">Nível de combustível:</label>
                    <select id="combustivel-retirada" required>
                        <option value="">Selecione</option>
                        <option value="Vazio">Vazio</option>
                        <option value="1/4">1/4</option>
                        <option value="1/2">1/2</option>
                        <option value="3/4">3/4</option>
                        <option value="Cheio">Cheio</option>
                    </select>

                    <label for="fotos-veiculo-retirada">Fotos gerais do veículo:</label>
                    <input type="file" id="fotos-veiculo-retirada" accept="image/*" multiple required>

                    <label for="avarias-retirada">Avarias (se houver):</label>
                    <textarea id="avarias-retirada"></textarea>

                    <label for="fotos-avarias-retirada">Fotos das avarias:</label>
                    <input type="file" id="fotos-avarias-retirada" accept="image/*" multiple>

                    <button type="submit">Enviar checklist</button>
                </form>

                <form id="form-devolucao" hidden>
                    <label for="km-devolucao">Quilometragem atual:</label>
                    <input type="number" id="km-devolucao" required>

                    <label for="foto-odometro-devolucao">Foto do odômetro:</label>
                    <input type="file" id="foto-odometro-devolucao" accept="image/*" required>

                    <label for="combustivel-devolucao">Nível de combustível:</label>
                    <select id="combustivel-devolucao" required>
                        <option value="">Selecione</option>
                        <option value="Vazio">Vazio</option>
                        <option value="1/4">1/4</option>
                        <option value="1/2">1/2</option>
                        <option value="3/4">3/4</option>
                        <option value="Cheio">Cheio</option>
                    </select>

                    <label for="fotos-veiculo-devolucao">Fotos gerais do veículo:</label>
                    <input type="file" id="fotos-veiculo-devolucao" accept="image/*" multiple required>

                    <label for="avarias-devolucao">Avarias (se houver):</label>
                    <textarea id="avarias-devolucao"></textarea>

                    <label for="fotos-avarias-devolucao">Fotos das avarias:</label>
                    <input type="file" id="fotos-avarias-devolucao" accept="image/*" multiple>

                    <label for="abastecimento">Valor do abastecimento:</label>
                    <input type="number" id="abastecimento" step="0.01" placeholder="Ex: 150.00">

                    <button type="submit">Enviar checklist</button>
                </form>
            </section>
        </main>

    </div>

    <script>
        // Marca no menu de filtros qual checklist está aberto
        const botoesTipo = [
            document.getElementById("btn-retirada"),
            document.getElementById("btn-devolucao")
        ];

        botoesTipo.forEach(botao => {
            botao.addEventListener("click", () => {
                botoesTipo.forEach(item => item.classList.remove("ativo"));
                botao.classList.add("ativo");
            });
        });
    </script>

</body>
</html>
